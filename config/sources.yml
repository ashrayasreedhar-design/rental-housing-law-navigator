# ---------------------------------------------------------------------------
# analyst_leads
#
# Facts supplied by a human operator during the build. These are NOT sources
# and NEVER become a quoted_span, a citation, or a rule record. They exist to:
#   (a) tell the fetcher what to look for (expect_contains assertions), and
#   (b) be cross-checked against retrieved text, so that a mismatch between
#       what the analyst believed and what the ordinance says is surfaced as a
#       conflict for human review rather than silently resolved either way.
#
# Every lead must be confirmed by a Tier 1-3 document before any rule relying
# on it can leave `requires_human_review`.
# ---------------------------------------------------------------------------
analyst_leads:
  - lead_id: L-JC-01
    jurisdiction: "Jersey City, NJ"
    expected_citation: "Jersey City Code § 218-12"
    expected_effective_date: "2025-06"
    category: algorithmic_rent_setting
    claim: >-
      Prohibits a landlord's use of algorithmic rent coordination services;
      includes public and private enforcement; civil fines up to $2,000 per day.
    expect_in_text: ["218-12"]
    verify_values:
      penalty_contains: ["2,000", "2000"]
    supports_rule: JC-ALG-01
    supports_test: T2
    provenance: analyst_supplied_unverified
    status: unverified

  - lead_id: L-HOB-01
    jurisdiction: "Hoboken, NJ"
    expected_citation: "Hoboken City Code ch. 158-2"
    expected_effective_date: "2025-07"
    category: algorithmic_rent_setting
    claim: >-
      Prohibits landlords from using software, algorithms or data-sharing
      platforms to coordinate or recommend rents, lease terms, or occupancy.
    expect_in_text: ["158", "Algorithmic Rent Fixing"]
    supports_rule: HOB-ALG-01
    supports_test: T2
    provenance: analyst_supplied_unverified
    status: unverified
    note: >-
      Consistent with the confirmed ecode360 page for D034 ("Article II,
      Algorithmic Rent Fixing in Rental Housing Market"), which should sit
      within chapter 158. Confirm the chapter number against retrieved text;
      a mismatch is a conflict, not a rounding error.

# ---------------------------------------------------------------------------
# provenance_policy
#
# Resolution order for originating a rule record. We always try to stand a
# rule on the strongest available evidence, and we never let a weaker source
# silently masquerade as a stronger one.
# ---------------------------------------------------------------------------
provenance_policy:
  ladder:
    - tier: 1
      name: primary_captured
      description: "Organizer-captured operative text (the ordinance/statute as enacted)."
      base_confidence: 0.90
      may_originate_rule: true
      default_review: not_required

    - tier: 2
      name: official_summary
      description: >-
        Organizer-captured OFFICIAL page that restates rather than enacts law
        (e.g. D067 NJ DCA Truth-in-Renting handbook, D079 sf.gov just-cause
        overview). Government-published, so citation is reliable, but the text
        is a restatement.
      base_confidence: 0.70
      may_originate_rule: true
      default_review: not_required

    - tier: 3
      name: team_retrieved_authority
      description: "Code publisher or official page retrieved by us from the allowlist."
      base_confidence: 0.60
      may_originate_rule: true
      default_review: requires_human_review

    - tier: 4
      name: secondary_attested
      description: >-
        LAST RESORT. No authority text could be retrieved, but a secondary
        source (law firm alert, news, trade publication) describes the rule
        specifically enough to record. Permitted ONLY under the conditions in
        `secondary_attested_rules` below. The rule is recorded so the system
        does not pretend the law does not exist -- but it is quarantined.
      base_confidence: 0.35
      may_originate_rule: true
      default_review: requires_human_review

    - tier: 5
      name: no_evidence
      description: "No retrievable text at all. No rule record is created."
      may_originate_rule: false

  secondary_attested_rules:
    # All of these must hold, or we fall through to tier 5 (unknown).
    require_all:
      - "Tier 1-3 retrieval for this rule was attempted and FAILED (recorded in out/fetch_report.json)."
      - "quoted_span is copied verbatim from the secondary document actually read -- never paraphrased, never attributed to the ordinance."
      - "source_url points at the secondary document, NOT at the ordinance we did not read."
      - "citation carries the official cite AND is marked unverified in conflict_note."
      - "conflict_flag = true."
      - "review_status = requires_human_review."
      - "Rule is EXCLUDED from the 'applies today' list until a human approves it."
      - "Address lookups touching this rule return result='unknown' with the gap named, not 'applies'."
    rationale: >-
      A consumer-facing compliance tool that silently omits a real ordinance is
      as wrong as one that invents a fake one. Recording the rule with honest,
      visibly weak provenance -- and refusing to act on it until reviewed --
      is more truthful than either extreme. The user sees "we believe a rule
      exists here, we could not verify it against primary text, here is who
      says so."

  applies_today_gate:
    description: >-
      The 'Rules that apply today' section may ONLY contain rules where ALL of:
    conditions:
      - "status == in_force as of the query date"
      - "review_status in (not_required, approved)"
      - "tier <= 3"
      - "quoted_span verified verbatim against its source document"
    everything_else: >-
      Routed to 'What's about to change' (pending / not_yet_effective) or to
      the data-quality panel (unverified / low confidence / conflicted).
