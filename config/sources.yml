# Source registry for targeted, allowlisted retrieval.
#
# Two registries with deliberately different powers:
#
#   authority:  may originate a rule record (supplies quoted_span + citation).
#               Code publishers and official .gov pages only. Everything
#               retrieved here is Tier 3 (team-retrieved) and is ALWAYS
#               flagged requires_human_review.
#
#   signal:     may NEVER originate a rule or supply a quoted_span. Attaches
#               corroboration / contradiction to rules that already exist from
#               Tier 1-3 evidence. Drives conflict_flag, conflict_note and
#               effective-date discrepancy detection.
#
# The manifest's own source_type classification is the basis for this split:
# every URL under `signal` is labelled "secondary (law firm / news / mirror)"
# by the organizers.
#
# This is an explicit allowlist, not a crawler. One page per entry, no link
# following, rate limited, robots.txt respected. README section 6 permits
# reading city code sites and publishers; it forbids bulk scraping.

defaults:
  rate_limit_seconds: 3.0
  timeout_seconds: 30
  user_agent: "RentalHousingLawNavigator/1.0 (MIT AI Hackathon prototype; contact via repo)"
  respect_robots: true
  max_retries: 2

